[project]
name = "lebutton"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zklosko", email = "31484611+zklosko@users.noreply.github.com" }
]
requires-python = ">=3.14"
asyncio_mode = "auto"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
lebutton = "lebutton:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]
